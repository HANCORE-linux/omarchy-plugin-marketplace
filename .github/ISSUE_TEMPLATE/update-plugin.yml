name: Request verified plugin update
description: Validate and promote a new exact commit for an existing community plugin source.
title: "[Update]: "
body:
  - type: markdown
    attributes:
      value: |
        A plugin update is a new exact marketplace snapshot. The current verified snapshot remains published until the requested commit passes compatibility validation, the Automated Security Baseline, explicit maintainer approval, testing, and deployment. Community code is never executed. Verification is not a security audit, certification, warranty, or endorsement.

  - type: input
    id: plugin-id
    attributes:
      label: Plugin ID
      description: Exact marketplace plugin ID shown by the existing listing. Multi-plugin sources are updated source-wide.
      placeholder: example.plugin
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Existing public GitHub repository root URL for this listing.
      placeholder: https://github.com/owner/repository
    validations:
      required: true

  - type: input
    id: update-commit
    attributes:
      label: Update commit
      description: Full 40-character SHA of the current repository HEAD to validate and propose as the new marketplace snapshot.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true

  - type: checkboxes
    id: acknowledgment
    attributes:
      label: Update acknowledgment
      options:
        - label: I understand that only the exact approved update commit can become a verified marketplace snapshot.
          required: true
