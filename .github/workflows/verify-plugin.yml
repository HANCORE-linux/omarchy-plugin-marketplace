name: Verify listed plugin

on:
  issues:
    types: [opened, edited, reopened]

concurrency:
  group: ${{ startsWith(github.event.issue.title, '[Verify]:') && 'plugin-catalog-writes' || format('ignored-verification-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  analyze:
    if: >-
      startsWith(github.event.issue.title, '[Verify]:') &&
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.verification.outputs.result }}
      changed: ${{ steps.verification.outputs.changed }}
      plugin_id: ${{ steps.verification.outputs.plugin_id }}
      commit_sha: ${{ steps.verification.outputs.commit_sha }}
      base_commit: ${{ steps.base.outputs.commit }}
      report_artifact_name: ${{ steps.identity.outputs.report_name }}
      publication_artifact_name: ${{ steps.identity.outputs.publication_name }}
      pages_artifact_name: ${{ steps.identity.outputs.pages_name }}
      deployment_id: ${{ steps.identity.outputs.deployment_id }}
      publication_sha: ${{ steps.bundle.outputs.publication_sha }}
      catalog_sha: ${{ steps.bundle.outputs.catalog_sha }}
    steps:
      - name: Check out main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Record verification base commit
        id: base
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record immutable artifact identities
        id: identity
        run: |
          set -euo pipefail
          echo "report_name=plugin-verification-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "publication_name=plugin-verification-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "pages_name=plugin-verification-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "deployment_id=verification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install verification dependencies
        run: npm ci

      - name: Analyze exact listed commit
        id: verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node scripts/verify-listed-plugin.mjs \
            --registry=registry.json \
            --catalog=site/catalog.json \
            --output-dir="$RUNNER_TEMP/plugin-verification-report"

      - name: Bundle verification report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/plugin-verification-report"
          test -f "$report/verification-result.json"
          test -f "$report/verification-report.md"
          (
            cd "$report"
            sha256sum verification-report.md verification-result.json > SHA256SUMS
          )

      - name: Upload verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.report_name }}
          path: ${{ runner.temp }}/plugin-verification-report
          if-no-files-found: error
          retention-days: 7

      - name: Record verification deployment identity
        if: steps.verification.outputs.result == 'verified' && steps.verification.outputs.changed == 'true'
        run: printf '%s\n' '${{ steps.identity.outputs.deployment_id }}' > site/deployment-id.txt

      - name: Test verified marketplace state
        if: steps.verification.outputs.result == 'verified' && steps.verification.outputs.changed == 'true'
        run: npm test

      - name: Bundle tested verification publication
        if: steps.verification.outputs.result == 'verified' && steps.verification.outputs.changed == 'true'
        id: bundle
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/plugin-verification-publication"
          mkdir -p "$bundle/site"
          cp registry.json "$bundle/registry.json"
          cp site/catalog.json "$bundle/site/catalog.json"
          (
            cd "$bundle"
            sha256sum registry.json site/catalog.json > SHA256SUMS
          )
          read -r catalog_sha _ < <(sha256sum site/catalog.json)
          read -r publication_sha _ < <(sha256sum "$bundle/SHA256SUMS")
          echo "catalog_sha=${catalog_sha}" >> "$GITHUB_OUTPUT"
          echo "publication_sha=${publication_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload tested verification publication
        if: steps.verification.outputs.result == 'verified' && steps.verification.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.publication_name }}
          path: ${{ runner.temp }}/plugin-verification-publication
          if-no-files-found: error
          retention-days: 7

      - name: Upload tested verification Pages artifact
        if: steps.verification.outputs.result == 'verified' && steps.verification.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.identity.outputs.pages_name }}
          path: site
          retention-days: 7

      - name: Confirm verification issue is still current
        if: steps.verification.outputs.result == 'verified' && steps.verification.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if ! jq -e '.state == "open" and (.pull_request | not)' <<< "$issue" >/dev/null; then
            echo "Verification issue is no longer open." >&2
            exit 1
          fi
          if ! jq -e --arg title "$EXPECTED_TITLE" '.title == $title' <<< "$issue" >/dev/null; then
            echo "Verification issue title changed after analysis." >&2
            exit 1
          fi
          current_body_sha="$(jq -j '.body // ""' <<< "$issue" | sha256sum | awk '{print $1}')"
          expected_body_sha="$(printf '%s' "$EXPECTED_BODY" | sha256sum | awk '{print $1}')"
          if [ "$current_body_sha" != "$expected_body_sha" ]; then
            echo "Verification issue body changed after analysis." >&2
            exit 1
          fi

  publish:
    if: needs.analyze.outputs.result == 'verified' && needs.analyze.outputs.changed == 'true'
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      issues: read
    outputs:
      published_commit: ${{ steps.publish.outputs.commit }}
    steps:
      - name: Check out tested verification base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.analyze.outputs.base_commit }}
          persist-credentials: false

      - name: Download tested verification publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.analyze.outputs.publication_artifact_name }}
          path: ${{ runner.temp }}/plugin-verification-publication

      - name: Verify and apply tested verification publication
        env:
          EXPECTED_CATALOG_SHA: ${{ needs.analyze.outputs.catalog_sha }}
          EXPECTED_PUBLICATION_SHA: ${{ needs.analyze.outputs.publication_sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/plugin-verification-publication"
          if [ -n "$(find "$bundle" -type l -print -quit)" ]; then
            echo "Artifact contains an unexpected symbolic link." >&2
            exit 1
          fi
          actual_files="$(cd "$bundle" && find . -type f -printf '%P\n' | sort)"
          expected_files="$(printf '%s\n' SHA256SUMS registry.json site/catalog.json | sort)"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Artifact contains unexpected publication files." >&2
            exit 1
          fi
          read -r artifact_publication_sha _ < <(sha256sum "$bundle/SHA256SUMS")
          test "$artifact_publication_sha" = "$EXPECTED_PUBLICATION_SHA"
          (cd "$bundle" && sha256sum --check SHA256SUMS)
          read -r artifact_catalog_sha _ < <(sha256sum "$bundle/site/catalog.json")
          test "$artifact_catalog_sha" = "$EXPECTED_CATALOG_SHA"
          cp "$bundle/registry.json" registry.json
          cp "$bundle/site/catalog.json" site/catalog.json
          git diff --exit-code -- . ':!registry.json' ':!site/catalog.json'

      - name: Recheck issue state before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if ! jq -e '.state == "open" and (.pull_request | not)' <<< "$issue" >/dev/null; then
            echo "Verification issue is no longer open." >&2
            exit 1
          fi
          if ! jq -e --arg title "$EXPECTED_TITLE" '.title == $title' <<< "$issue" >/dev/null; then
            echo "Verification issue title changed before publication." >&2
            exit 1
          fi
          current_body_sha="$(jq -j '.body // ""' <<< "$issue" | sha256sum | awk '{print $1}')"
          expected_body_sha="$(printf '%s' "$EXPECTED_BODY" | sha256sum | awk '{print $1}')"
          test "$current_body_sha" = "$expected_body_sha"

      - name: Commit and push tested verification
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_BASE_COMMIT: ${{ needs.analyze.outputs.base_commit }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLUGIN_ID: ${{ needs.analyze.outputs.plugin_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json site/catalog.json
          git diff --cached --check
          git commit -m "Verify ${PLUGIN_ID} plugin (#${ISSUE_NUMBER})"

          git fetch origin main
          remote_main="$(git rev-parse origin/main)"
          if [ "$remote_main" != "$EXPECTED_BASE_COMMIT" ]; then
            echo "main changed after the tested verification; refusing to rebase or publish stale artifacts." >&2
            exit 1
          fi

          authorization="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${authorization}" \
            push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    if: needs.analyze.outputs.result == 'verified' && needs.analyze.outputs.changed == 'true'
    needs: [analyze, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: github-pages-deployments
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Verify tested commit is still current
        env:
          EXPECTED_COMMIT: ${{ needs.publish.outputs.published_commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "https://github.com/${REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          if [ -z "$remote_main" ] || [ "$remote_main" != "$EXPECTED_COMMIT" ]; then
            echo "main changed before deployment; refusing to deploy an older verification artifact." >&2
            exit 1
          fi

      - name: Deploy tested verification Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.analyze.outputs.pages_artifact_name }}
          timeout: 300000

      - name: Confirm deployed verification after Pages timeout
        if: steps.deployment.outcome == 'failure'
        env:
          EXPECTED_CATALOG_SHA: ${{ needs.analyze.outputs.catalog_sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ needs.analyze.outputs.deployment_id }}
        run: |
          set -euo pipefail
          live_catalog="$RUNNER_TEMP/live-catalog.json"
          live_deployment_id="$RUNNER_TEMP/live-deployment-id.txt"
          for (( attempt = 1; attempt <= 12; attempt++ )); do
            check_url="https://omarchyplugins.com/catalog.json?verification-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            marker_url="https://omarchyplugins.com/deployment-id.txt?verification-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl --fail --silent --show-error --location --max-time 10 \
              --output "$live_deployment_id" "$marker_url" \
              && curl --fail --silent --show-error --location --max-time 10 \
                --output "$live_catalog" "$check_url"; then
              read -r live_sha _ < <(sha256sum "$live_catalog")
              live_id="$(tr -d '\r\n' < "$live_deployment_id")"
              if [[ $live_id == "$EXPECTED_DEPLOYMENT_ID" && $live_sha == "$EXPECTED_CATALOG_SHA" ]]; then
                echo "The expected verification is live despite the Pages action timeout."
                exit 0
              fi
            fi
            if (( attempt < 12 )); then
              sleep 10
            fi
          done
          echo "::error::Pages deployment failed and the expected verification did not become live."
          exit 1

  report:
    if: >-
      always() &&
      needs.analyze.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    needs: [analyze, publish, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download verification report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.analyze.outputs.report_artifact_name }}
          path: ${{ runner.temp }}/plugin-verification-report

      - name: Verify verification report
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/plugin-verification-report"
          if [ -n "$(find "$report" -type l -print -quit)" ]; then
            echo "Report contains an unexpected symbolic link." >&2
            exit 1
          fi
          actual_files="$(cd "$report" && find . -type f -printf '%P\n' | sort)"
          expected_files="$(printf '%s\n' SHA256SUMS verification-report.md verification-result.json | sort)"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Report contains unexpected files." >&2
            exit 1
          fi
          (cd "$report" && sha256sum --check SHA256SUMS)

      - name: Publish verification result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ needs.analyze.outputs.result }}
          EXPECTED_TITLE: ${{ github.event.issue.title }}
          EXPECTED_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          if ! jq -e '.state == "open" and (.pull_request | not)' <<< "$issue" >/dev/null; then
            echo "Verification issue is no longer open." >&2
            exit 1
          fi
          if ! jq -e --arg title "$EXPECTED_TITLE" '.title == $title' <<< "$issue" >/dev/null; then
            echo "Verification issue title changed before reporting." >&2
            exit 1
          fi
          current_body_sha="$(jq -j '.body // ""' <<< "$issue" | sha256sum | awk '{print $1}')"
          expected_body_sha="$(printf '%s' "$EXPECTED_BODY" | sha256sum | awk '{print $1}')"
          if [ "$current_body_sha" != "$expected_body_sha" ]; then
            echo "Verification issue body changed before reporting." >&2
            exit 1
          fi

          report="$RUNNER_TEMP/plugin-verification-report/verification-report.md"
          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-plugin-verification -->"))) | .id' \
              | tail -n 1
          )"
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$report" > "$RUNNER_TEMP/plugin-verification-comment.json"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/plugin-verification-comment.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$report"
          fi

          status_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-plugin-verification-status -->"))) | .id'
          )"
          while IFS= read -r status_id; do
            [ -z "$status_id" ] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${status_id}"
          done <<< "$status_ids"

          if [ "$RESULT" = verified ] || [ "$RESULT" = already-verified ]; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi

  report-failure:
    if: >-
      always() &&
      (needs.analyze.result == 'failure' || needs.analyze.result == 'cancelled' ||
       needs.publish.result == 'failure' || needs.publish.result == 'cancelled' ||
       needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled' ||
       needs.report.result == 'failure' || needs.report.result == 'cancelled')
    needs: [analyze, publish, deploy, report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report verification workflow failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status_file="$RUNNER_TEMP/plugin-verification-status.md"
          printf '<!-- marketplace-plugin-verification-status -->\n**Verification workflow failed.** The automated result was not published. A maintainer must review the workflow before retrying.\n\nWorkflow: %s\n' \
            "$RUN_URL" > "$status_file"
          comment_id="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-plugin-verification-status -->"))) | .id' \
              | tail -n 1
          )"
          if [ -n "$comment_id" ]; then
            jq -Rs '{body: .}' "$status_file" > "$RUNNER_TEMP/plugin-verification-status.json"
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input "$RUNNER_TEMP/plugin-verification-status.json"
          else
            gh issue comment "$ISSUE_NUMBER" --body-file "$status_file"
          fi
