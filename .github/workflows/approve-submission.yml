name: Publish approved plugin submission

on:
  issues:
    types: [labeled]

concurrency:
  group: plugin-catalog-writes
  cancel-in-progress: false
  queue: max

jobs:
  approve:
    if: >-
      github.event.label.name == 'approved-for-listing' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: read
    outputs:
      plugin_id: ${{ steps.approval.outputs.plugin_id }}
      plugin_name: ${{ steps.approval.outputs.plugin_name }}
      plugin_name_markdown: ${{ steps.approval.outputs.plugin_name_markdown }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm ci

      - name: Approve and register submission
        id: approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          APPROVER_LOGIN: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPROVED_ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/approve-submission.mjs

      - name: Detect registry change
        id: registry
        run: |
          if git diff --quiet -- registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild marketplace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Test marketplace
        run: npm test

      - name: Commit and push plugin
        if: steps.registry.outputs.changed == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLUGIN_NAME: ${{ steps.approval.outputs.plugin_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json site/catalog.json site/assets/img/plugins/
          if git diff --cached --quiet; then
            echo "Registry and catalog are already current; continuing deployment."
            exit 0
          fi
          git commit -m "Add ${PLUGIN_NAME} plugin (#${ISSUE_NUMBER})"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done

          echo "Plugin push failed after three attempts."
          exit 1

  deploy:
    needs: approve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: github-pages-deployments
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm ci

      - name: Build current marketplace
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test current marketplace
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Record catalog checksum
        id: catalog
        run: |
          read -r catalog_sha _ < <(sha256sum site/catalog.json)
          echo "sha256=${catalog_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload current marketplace
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Confirm deployed catalog after Pages timeout
        if: steps.deployment.outcome == 'failure'
        env:
          EXPECTED_CATALOG_SHA: ${{ steps.catalog.outputs.sha256 }}
        run: |
          live_catalog="$RUNNER_TEMP/live-catalog.json"
          for (( attempt = 1; attempt <= 12; attempt++ )); do
            check_url="https://omarchyplugins.com/catalog.json?deployment-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl --fail --silent --show-error --location --max-time 10 \
              --output "$live_catalog" "$check_url"; then
              read -r live_sha _ < <(sha256sum "$live_catalog")
              if [[ $live_sha == "$EXPECTED_CATALOG_SHA" ]]; then
                echo "The expected catalog is live despite the Pages action timeout."
                exit 0
              fi
            fi
            if (( attempt < 12 )); then
              sleep 10
            fi
          done

          echo "::error::Pages deployment failed and the expected catalog did not become live."
          exit 1

  finalize:
    needs: [approve, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Mark submission as listed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PLUGIN_ID: ${{ needs.approve.outputs.plugin_id }}
          PLUGIN_NAME_MARKDOWN: ${{ needs.approve.outputs.plugin_name_markdown }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label listed
          gh issue comment "$ISSUE_NUMBER" --body "Published **${PLUGIN_NAME_MARKDOWN}**: https://omarchyplugins.com/plugin.html?id=${PLUGIN_ID}"
          gh issue close "$ISSUE_NUMBER" --reason completed

  report-failure:
    if: >-
      always() &&
      (needs.approve.result == 'failure' || needs.deploy.result == 'failure' || needs.finalize.result == 'failure')
    needs: [approve, deploy, finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Reopen approval after approval failure
        if: needs.approve.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/approved-for-listing" >/dev/null 2>&1 || true
          gh issue comment "$ISSUE_NUMBER" --body "Submission approval failed. Review the workflow run and apply \`approved-for-listing\` again after the problem is fixed: ${RUN_URL}"

      - name: Report deployment failure
        if: needs.approve.result == 'success' && needs.deploy.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "The plugin was registered, but Pages publication could not be confirmed. Do not reapply \`approved-for-listing\`; retry only the Pages deployment after reviewing: ${RUN_URL}"

      - name: Report finalization failure
        if: needs.approve.result == 'success' && needs.deploy.result == 'success' && needs.finalize.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Pages publication succeeded, but issue finalization failed. Complete the \`listed\` label and closure manually after reviewing: ${RUN_URL}"
