name: Refresh plugin catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-catalog-writes
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Refresh repository data and previews
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test generated catalog
        run: npm test

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/catalog.json site/assets/img/plugins/

          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi

          git commit -m "Refresh plugin catalog"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done

          echo "Catalog push failed after three attempts."
          exit 1

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: github-pages-deployments
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Build current marketplace
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test current marketplace
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Record catalog checksum
        id: catalog
        run: |
          read -r catalog_sha _ < <(sha256sum site/catalog.json)
          echo "sha256=${catalog_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload current marketplace
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

      - name: Deploy refreshed GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Confirm deployed catalog after Pages timeout
        if: steps.deployment.outcome == 'failure'
        env:
          EXPECTED_CATALOG_SHA: ${{ steps.catalog.outputs.sha256 }}
        run: |
          live_catalog="$RUNNER_TEMP/live-catalog.json"
          for (( attempt = 1; attempt <= 12; attempt++ )); do
            check_url="https://omarchyplugins.com/catalog.json?deployment-check=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl --fail --silent --show-error --location --max-time 10 \
              --output "$live_catalog" "$check_url"; then
              read -r live_sha _ < <(sha256sum "$live_catalog")
              if [[ $live_sha == "$EXPECTED_CATALOG_SHA" ]]; then
                echo "The expected catalog is live despite the Pages action timeout."
                exit 0
              fi
            fi
            if (( attempt < 12 )); then
              sleep 10
            fi
          done

          echo "::error::Pages deployment failed and the expected catalog did not become live."
          exit 1
