name: Refresh plugin catalog

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-catalog-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Refresh repository data and previews
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test generated catalog
        run: npm test

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/catalog.json site/assets/img/plugins/

          if git diff --cached --quiet; then
            echo "Catalog is already current."
            exit 0
          fi

          git commit -m "Refresh plugin catalog"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done

          echo "Catalog push failed after three attempts."
          exit 1
