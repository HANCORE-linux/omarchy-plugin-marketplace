name: Validate plugin submission

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: validate-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.issue.state == 'open' &&
      (github.event.action != 'labeled' || github.event.label.name == 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install build dependencies
        run: npm ci

      - name: Classify submission
        id: intake
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: node scripts/intake-submission.mjs

      - name: Add submission label
        if: steps.intake.outputs.should_label == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh label create submission --color 1d76db --description "Plugin marketplace submission" --force
          gh issue edit "$ISSUE_NUMBER" --add-label submission

      - name: Validate repository and manifests
        if: steps.intake.outputs.should_validate == 'true'
        id: validation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          if node scripts/validate-submission.mjs > validation-report.md; then
            echo "result=validated" >> "$GITHUB_OUTPUT"
          else
            echo "result=needs-fixes" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish validation report
        if: steps.intake.outputs.should_validate == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          COMMENT_ID="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- marketplace-validation -->"))) | .id' \
              | tail -n 1
          )"
          if [ -n "$COMMENT_ID" ]; then
            jq -Rs '{body: .}' validation-report.md > validation-comment.json
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --input validation-comment.json
          else
            gh issue comment "$ISSUE_NUMBER" --body-file validation-report.md
          fi

      - name: Update validation labels
        if: steps.intake.outputs.should_validate == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.validation.outputs.result }}
        run: |
          gh label create validated --color 2da44e --description "Automated marketplace checks passed" --force
          gh label create needs-fixes --color d1242f --description "Submission needs changes before review" --force
          gh label create approved-for-listing --color bf4b55 --description "Approved for marketplace listing" --force
          gh label create listed --color 8250df --description "Published in the marketplace" --force

          if [ "$RESULT" = "validated" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label validated
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/needs-fixes" >/dev/null 2>&1 || true
          else
            gh issue edit "$ISSUE_NUMBER" --add-label needs-fixes
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/labels/validated" >/dev/null 2>&1 || true
          fi
